[project]
name = "cybersecurity-knowledge-advisor"
version = "0.1.0"
description = "Adaptive hybrid RAG chatbot for trusted cybersecurity guidance"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "structlog>=24.4,<27.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sentence-transformers>=5.1,<6",
    "qdrant-client>=1.15,<2",
]

[dependency-groups]
ingestion = ["langchain-text-splitters>=1.0,<2.0", "pymupdf>=1.28,<2.0"]
dev = [
    {include-group = "ingestion"},
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybersecurity_advisor"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["Final_Project_Rubric_Detailed.md", "plan.md"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
